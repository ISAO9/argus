# =============================================================================
# configs/argus.yaml
# Master configuration for the ARGUS pipeline. All values reflect the settings
# reported in the manuscript (Table S2, electronic supplement). Edit paths to
# point at your local copies of the public datasets (see data/README.md).
# =============================================================================

seed: 1234
device: auto            # auto | cpu | cuda | mps

paths:
  data_raw:        data/raw
  data_processed:  data/processed
  models:          models
  figures:         PDF
  # Reused assets carried over from prior ARGUS development (cite in scripts):
  hinet_graph:     data/processed/hinet_graph_v2.pt    # graph tensor (688 events)
  knet_h5:         data/processed/knet_dataset.h5       # FNO-NAMI validation DB
  locator_ckpt:    models/best_locator.pt
  swift_ckpt:      models/checkpoint_epoch_080.pt
  fno_ckpt:        models/fno_best.pth

# ----------------------------- GNN-Locator ---------------------------------
gnn_locator:
  node_feat_dim:   22
  edge_feat_dim:   4
  hidden_dim:      128
  attention_heads: 4
  gatv2_layers:    4
  dropout:         0.1
  out_dim:         3            # (lat, lon, depth) in normalized coords
  # training
  epochs:          80
  batch_size:      32
  lr:              1.0e-3
  weight_decay:    1.0e-4
  lr_schedule:     cosine
  # K-NET fine-tune
  finetune_epochs: 30
  finetune_lr:     5.0e-5

# ----------------------------- SWIFT CMT -----------------------------------
swift_cmt:
  waveform_base_channels: 16
  fourier_bins:           32
  gatv2_layers:           3
  hidden_dim:             128
  dropout:                0.2
  n_mechanism_classes:    3      # Shear / Tensile / Mixed
  batch_size:             64
  epochs:                 80
  lr:                     1.0e-3
  weight_decay:           1.0e-4
  loss_weights: { mechanism_ce: 1.0, fiso_mse: 0.5, mw_mse: 0.1 }

# ----------------------------- FNO-NAMI ------------------------------------
fno_nami:
  in_channels:   4
  lift_channels: 64
  fourier_modes: 16
  n_fno_layers:  4
  out_grid:      128            # 128 x 128 PGA map
  epochs:        150
  batch_size:    16
  lr:            1.0e-3
  weight_decay:  1.0e-4
  # log-PGA normalization constants used at inference (manuscript Eq. 5)
  mu_logpga:     -18.032
  sigma_logpga:  5.287

# --------------------------- Conformal layer -------------------------------
conformal:
  n_calibration: 138
  nominal_level: 0.90

# ----------------------------- Datasets ------------------------------------
data:
  synthetic_n_events:  5000     # synthetic FORGE training events
  synthetic_split:     [0.70, 0.15, 0.15]
  real_n_events:       688      # Kumamoto 2016 validation
  egs_band:            [2.6, 4.0]
  bandpass_locator:    [1.0, 15.0]
  bandpass_knet:       [0.1, 25.0]
  sampling_rate_hz:    100
